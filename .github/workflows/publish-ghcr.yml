name: Publish OpenTofu OCI provider

# Fork-specific distribution workflow. This intentionally uses a tag prefix that
# does not match the upstream release workflow's `v*` trigger, so fork releases
# do not require upstream GPG or GitHub App secrets.
on:
  push:
    tags:
      - "ghcr-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Provider SemVer to publish (for example: 2026.8.0-robets.1)"
        required: true
        type: string
      ref:
        description: "Branch, tag, or commit to build (for example: feat/token-write-only-key)"
        required: true
        default: "main"
        type: string

permissions:
  contents: read
  packages: write

env:
  OCI_REPOSITORY: ghcr.io/robets/opentofu-providers/goauthentik/authentik

jobs:
  publish:
    name: Build and publish provider OCI artifact
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Determine provider version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            version="${GITHUB_REF_NAME#ghcr-v}"
          else
            version="${DISPATCH_VERSION}"
          fi

          # OpenTofu OCI provider tags must be SemVer. Build metadata uses `_`
          # instead of `+` in OCI tag names, so keep the version itself free of
          # '+' here to also keep provider archive names conventional.
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid provider version: ${version}" >&2
            echo "Expected SemVer such as 2026.8.0 or 2026.8.0-robets.1" >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build provider archives
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          mkdir -p dist

          build_target() {
            local os="$1"
            local arch="$2"
            local suffix=""
            local binary="terraform-provider-authentik_v${VERSION}"

            if [[ "${os}" == "windows" ]]; then
              suffix=".exe"
            fi

            echo "Building ${os}/${arch}"
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" \
              go build \
                -trimpath \
                -ldflags="-s -w -X main.version=${VERSION}" \
                -o "dist/${binary}${suffix}" .

            (
              cd dist
              zip -q "terraform-provider-authentik_${VERSION}_${os}_${arch}.zip" \
                "${binary}${suffix}"
              rm "${binary}${suffix}"
            )
          }

          build_target linux amd64
          build_target linux arm64
          build_target darwin amd64
          build_target darwin arm64
          build_target windows amd64
          build_target windows arm64

          (cd dist && sha256sum *.zip > "terraform-provider-authentik_${VERSION}_SHA256SUMS")

      - name: Install ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4
        with:
          version: "1.3.0"

      - name: Log in to GHCR
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            oras login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Assemble OpenTofu provider OCI image
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          layout="oci-layout"
          platforms=(
            darwin_amd64
            darwin_arm64
            linux_amd64
            linux_arm64
            windows_amd64
            windows_arm64
          )

          for target in "${platforms[@]}"; do
            os="${target%%_*}"
            arch="${target#*_}"
            archive="dist/terraform-provider-authentik_${VERSION}_${os}_${arch}.zip"

            oras push \
              --artifact-type application/vnd.opentofu.provider-target \
              --artifact-platform "${os}/${arch}" \
              --oci-layout "${layout}:${target}" \
              "${archive}:archive/zip"
          done

          oras manifest index create \
            --artifact-type application/vnd.opentofu.provider \
            --oci-layout "${layout}:${VERSION}" \
            "${platforms[@]}"

      - name: Publish to GHCR
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          oras cp \
            --from-oci-layout "oci-layout:${VERSION}" \
            "${OCI_REPOSITORY}:${VERSION}"

      - name: Show published provider
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Published ${OCI_REPOSITORY}:${VERSION}"
          echo "Source commit: $(git rev-parse HEAD)"
          echo "OpenTofu provider source remains: goauthentik/authentik"
